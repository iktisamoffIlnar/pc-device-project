<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Интерактивное устройство ПК</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div>
      <h1>Интерактивное устройство ПК</h1>
      <p>Изучи внешнее и внутреннее строение компьютера</p>
    </div>

    <div class="header-buttons">
      <button id="backButton" class="nav-button hidden">Назад</button>
      <button id="homeButton" class="nav-button">Главный экран</button>
    </div>
  </header>

  <main id="app" class="app"></main>

  <section id="infoPanel" class="info-panel hidden">
    <button id="closeInfo" class="close-button">×</button>
    <h2 id="infoTitle"></h2>
    <p id="infoPurpose"></p>
    <p id="infoPrinciple"></p>
    <p id="infoFact"></p>

  <script src="script.js"></script>

</html>
